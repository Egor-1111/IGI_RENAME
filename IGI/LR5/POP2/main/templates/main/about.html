{% block content %}
<h2>О компании</h2>

{% if company.logo %}
  <img src="{{ company.logo.url }}" alt="Логотип компании" style="max-width: 200px;">
{% endif %}

<p><strong>Основана в:</strong> {{ company.founding_year }}</p>
<p>{{ company.history }}</p>

<h3>Реквизиты:</h3>
<pre>{{ company.requisites }}</pre>
{% endblock %}
<a href="{% url 'home' %}">На главную</a>
