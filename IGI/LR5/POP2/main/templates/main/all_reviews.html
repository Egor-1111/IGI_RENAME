<h2>Все отзывы</h2>
{% if reviews %}
  <ul>
    {% for review in reviews %}
      <li>
        <strong>{{ review.client }}</strong> о <strong>{{ review.tour }}</strong>:
        <br>Оценка: {{ review.rating }} / 5
        <br>{{ review.text }}
        <br><small>{{ review.created_at }}</small>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>Отзывов пока нет.</p>
{% endif %}
<a href="{% url 'home' %}">На главную</a>
