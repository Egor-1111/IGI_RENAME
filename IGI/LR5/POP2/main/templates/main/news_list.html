{% block content %}
<h2>Новости</h2>
<ul>
    {% for article in articles %}
        <li>
            <h3>{{ article.title }}</h3>
            {% if article.image %}
                <img src="{{ article.image.url }}" style="max-width: 200px;">
            {% endif %}
            <p>{{ article.short_description }}</p>
            <a href="{% url 'news_detail' article.pk %}">Читать далее</a>
        </li>
        <hr>
    {% endfor %}
</ul>
{% endblock %}
<a href="{% url 'home' %}">На главную</a>
